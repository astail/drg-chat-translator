###############################################################################
#  DRGTranslate settings
#
#  The first time you run DRGTranslate.exe, settings.ini is created from this
#  file. To change a setting, open settings.ini (next to the exe) in a text
#  editor, edit it, and restart DRGTranslate.exe.
#
#  Every option is listed here with its default value, commented out. Only the
#  lines whose leading # you remove are applied; the rest keep their defaults.
#  In other words: uncomment only what you want to change.
#
#  To run the setup again from the start, delete settings.ini and launch
#  DRGTranslate.exe (you will have to paste your API key again).
#
#  How the mod behaves inside the game (hotkey, how translations are shown,
#  relay pacing) is set in config.lua in the game's Mods folder instead.
#
#  This file is written in English so that it is readable whatever language
#  you play in. The full documentation is available in six languages at
#  https://github.com/astail/drg-chat-translator
###############################################################################


#==============================================================================
# 1. Start here  -  translation service and API key
#==============================================================================

# Which translation service to use: deepl / claude / openai
#
#   deepl   ... machine translation. Has a free tier
#   claude  ... good with slang and typos. Pay as you go
#   openai  ... good with slang and typos. Pay as you go
#   (Everything needed is bundled in the exe. Only when you run from source,
#    claude needs `pip install anthropic` and openai needs `pip install openai`)
#
#DRGT_PROVIDER=deepl


# --- API keys (you only need the one for the service you use) -----------------

# DeepL   https://www.deepl.com/pro-api   free-tier keys end with :fx
#DEEPL_AUTH_KEY=

# Claude  https://platform.claude.com/settings/keys
#ANTHROPIC_API_KEY=

# OpenAI  https://platform.openai.com/api-keys
#OPENAI_API_KEY=


#==============================================================================
# 2. Per-service options
#==============================================================================

# --- DeepL --------------------------------------------------------------------

# Endpoint. When empty it is picked from the key type (whether it ends with :fx)
#DRGT_DEEPL_API_URL=


# --- Claude -------------------------------------------------------------------

# Which model to use. Chat lines are short, so the default Haiku is plenty.
# If the wording is not good enough, move up: claude-sonnet-5, claude-opus-5.
#   claude-haiku-4-5   $1 / $5   (input/output per million tokens)
#   claude-sonnet-5    $2 / $10
#   claude-opus-5      $5 / $25
#DRGT_CLAUDE_MODEL=claude-haiku-4-5

# Token limit for one reply
#DRGT_CLAUDE_MAX_TOKENS=1024

# How hard the model thinks: auto / low / medium / high / xhigh / max
# (auto means low). Only models 4.6 and newer use this; older models ignore it,
# and the 4.6 models do not take xhigh. A value the model cannot take is
# reported when DRGTranslate starts, and auto is used instead
#DRGT_CLAUDE_EFFORT=auto

# When a translation is refused (abusive wording and such), fall back to
# another model automatically: auto / true / false.
# "auto" only does this on models that support it; false turns it off
#DRGT_CLAUDE_REFUSAL_FALLBACK=auto


# --- OpenAI -------------------------------------------------------------------

# Which model to use. Pick one your account can call
#DRGT_OPENAI_MODEL=gpt-4o-mini

# Token limit for one reply
#DRGT_OPENAI_MAX_TOKENS=1024

# Set this only to point at another OpenAI-compatible endpoint.
# With a local LLM (Ollama, LM Studio and so on) nothing you type or read
# ever leaves your PC.
#   e.g. DRGT_OPENAI_BASE_URL=http://localhost:11434/v1
#DRGT_OPENAI_BASE_URL=


#==============================================================================
# 3. What gets translated
#==============================================================================

# --- Language of this program -------------------------------------------------

# The language of the setup wizard and of the messages in the console window.
# The setup wizard writes the language you picked here.
#   ja / en / ko / zh / zh-tw / ru  (anything else falls back to English)
# When this is not set, the language of DRGT_INCOMING_TARGET below is used, and
# failing that, the language Windows itself is running in. So the value on the
# line below is an example, not the default.
#DRGT_UI_LANG=en


# --- Incoming (turn what your fellow dwarves say into your language) ----------

#DRGT_INCOMING_ENABLED=true

# The language to translate into. The setup wizard writes your choice here
#DRGT_INCOMING_TARGET=ja

# Do not show a translation in your own chat for these languages (comma
# separated). When omitted it is the same as DRGT_INCOMING_TARGET above, so you
# do not need to touch it just because you changed the target language. Set it
# only to add languages you can read yourself (ja,en if you read Japanese but
# English is fine too).
# Languages are told apart by their script, so "en" also covers German,
# Spanish and every other language written in the Latin alphabet.
# Host relay (DRGT_RELAY_* below) ignores this setting, so what you say still
# reaches people who read another language
#DRGT_INCOMING_SKIP_LANGUAGES=ja

# How a translation is shown in chat. {sender} {text} {lang} {original} work.
# Anything else is reported when DRGTranslate starts, and the default is used.
# The setup wizard writes [TL] instead of [訳] for every language but Japanese
#DRGT_INCOMING_FORMAT=[訳] {sender}: {text}

# Do not translate messages longer than this
#DRGT_INCOMING_MAX_CHARS=400


# --- Outgoing (translate what you say before it is sent) ----------------------

#DRGT_OUTGOING_ENABLED=true

# The language you type in. Only messages in this language are translated;
# anything else is sent as is. Use en if you type in English
# (ja matches messages that contain kana or kanji). Use auto to translate
# whatever language you type in (the language is guessed from the letters)
#DRGT_OUTGOING_SOURCE=ja

# Target languages (comma separated). Use just en if English is enough
#   ja=Japanese / en=English / ko=Korean / zh=Chinese (simplified, mainland)
#   zh-tw=Chinese (traditional, Taiwan) / ru=Russian
#   The source language is dropped automatically
#   Every extra language makes the line longer; about three is a good limit
#DRGT_OUTGOING_TARGETS=en,ko,zh

# What goes between the languages. Quoted so the spaces are kept
#DRGT_OUTGOING_SEPARATOR=" / "

# Put the original text in front of the translation.
# The original is already sent as its own message first, so false is fine
#DRGT_OUTGOING_INCLUDE_SOURCE=false

# Do not translate messages longer than this
#DRGT_OUTGOING_MAX_CHARS=200

# Do not translate messages shorter than this (in characters)
#DRGT_OUTGOING_MIN_LENGTH=2

# Do not translate messages that start with one of these (commands and such).
# Separate them with commas
#DRGT_OUTGOING_IGNORE_PREFIXES=/,!,.


# --- Relay (only when you host: push translations of others to everyone) ------
#
# For an English message it builds JP/KR/ZH, for a Korean one JP/EN/ZH, for a
# Japanese one EN/KR/ZH - the speaker's own language is left out - and posts
# them all as a single chat line. It does nothing when you join someone else's
# game as a client.
#
#   Karl: 気をつけろ、大群が来るぞ / 조심해 / 小心
#
# The relay shares the one API call made for the incoming translation, so it
# does not add calls (it does add languages to that call).

#DRGT_RELAY_ENABLED=true

# Languages to relay. The speaker's own language is dropped automatically.
# Always keep your own language in this list: when you host a multiplayer game,
# the translation you read comes from this very line, so removing it leaves
# your own screen empty
#DRGT_RELAY_TARGETS=ja,en,ko,zh

# Format of the first language. {lang}=language (JP/EN/KR/ZH) {sender}=speaker
# {text}=translation {original}=original text. Anything else is reported when
# DRGTranslate starts, and the default is used (the same goes for the next one).
# Keep the leading "{sender}: ": without it nobody can tell whose message was
# translated, and the mod uses it to recognise its own relay lines
#DRGT_RELAY_FORMAT="{sender}: {text}"

# Format of the second and later languages, and what joins them.
# Use "[{lang}] {text}" if you want each language labelled
#DRGT_RELAY_ITEM_FORMAT="{text}"
#DRGT_RELAY_SEPARATOR=" / "

# Do not relay messages longer than this (long text is not read anyway)
#DRGT_RELAY_MAX_CHARS=200

# How many languages one message may be relayed into. When this line is left
# out, it is the number of languages in DRGT_RELAY_TARGETS. If you set it lower
# than that, DRGTranslate warns at startup, because the last languages can be
# dropped
#DRGT_RELAY_MAX_LANGS=4

# Character limit for one relayed line. 0 keeps everything on one line.
# Set something like 200 only if the game cuts long lines off
#DRGT_RELAY_MAX_LINE_CHARS=0


#==============================================================================
# 4. Cache and glossary
#==============================================================================

# Remembers translations so the same line is not paid for twice. Entries are
# kept per provider and model.
# Note: what other players said ends up in this file. Set false if that
# bothers you
#DRGT_CACHE_ENABLED=true
#DRGT_CACHE_MAX_ENTRIES=5000
#DRGT_CACHE_PATH=bridge/cache.json

# Table that replaces set phrases such as "Rock and Stone!" without calling
# the API
#DRGT_GLOSSARY_ENABLED=true
#DRGT_GLOSSARY_PATH=bridge/glossary.json


#==============================================================================
# 5. Overlay (a small window, as a backup when in-game display does not work)
#==============================================================================

# Normally not needed. Turn it on if translations do not show up while you
# host. The game has to run in "Windowed (Fullscreen)" mode for the overlay to
# stay in front
#DRGT_OVERLAY_ENABLED=false

# always ... always visible / auto ... only when the game cannot show it /
# off ... never
#DRGT_OVERLAY_MODE=auto

# With auto, hide the window this many seconds after the last translation.
# 0 keeps it visible (it never hides while you are typing in it)
#DRGT_OVERLAY_HIDE_AFTER=12

# Number of lines, look and position
#DRGT_OVERLAY_LINES=8
#DRGT_OVERLAY_FONT_SIZE=13
#DRGT_OVERLAY_OPACITY=0.85
#DRGT_OVERLAY_X=40
#DRGT_OVERLAY_Y=40
#DRGT_OVERLAY_WIDTH=520

# Show an input box in the overlay (what you type there is translated and sent
# to the game chat)
#DRGT_OVERLAY_COMPOSER=true


#==============================================================================
# 6. Network and logging (you rarely need to touch these)
#==============================================================================

# Seconds to wait for a reply. Used by deepl
#DRGT_TIMEOUT_SEC=6.0

# Used by claude / openai. They take longer than machine translation, so they
# get their own limit
#DRGT_LLM_TIMEOUT_SEC=20.0

# How many translations may run at the same time
#DRGT_MAX_WORKERS=4

# Minimum seconds between translation requests. Raise it if you hit rate limits
#DRGT_MIN_INTERVAL_SEC=0.0

# debug / info / warning / error
#DRGT_LOG_LEVEL=info
