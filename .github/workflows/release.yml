# タグを打つとリリースされる。
#
#     git tag v0.5.0
#     git push origin v0.5.0
#
# Windows ランナーで exe をビルドし、設定ファイルと一緒に zip にして
# GitHub Releases へ添付する。ダウンロードした人は zip を展開して
# exe を実行し、APIキーを入れるだけで使える状態になる。
#
# 手動実行(workflow_dispatch)もできる。その場合はリリースを作らず、
# zip を Actions の成果物として残すだけなので、公開前の確認に使える。

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # リリースの作成に必要

# 同じタグで二重に走らせない（途中で止めると半端なリリースが残るので、後から来た方を待たせる）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # Windows の Python は既定の標準出力が cp1252 なので、
      # 日本語のログを出した瞬間に UnicodeEncodeError で落ちる
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存を入れる
        # 版は requirements.txt / requirements-dev.txt で固定している。
        # 同じタグからは同じ SDK を同梱した exe ができる
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: タグとソースのバージョンが一致するか確認
        # v0.5.0 のタグなのに中身が 0.4.1、という取り違えを防ぐ。
        # バージョンはアプリ全体で1つなので、bridge と MOD の番号もそろっているか見る
        # （手動実行でも確認する。タグとの照合はタグのときだけ）。
        # UE4SS のバージョンは exe のウィザードと install.ps1 に別々に書いてあるので、
        # 2つがそろっているかもここで見る（片方だけ上げると入るものが変わる）。
        # タグ名は環境変数経由で渡す（run に直接埋め込まない）
        shell: bash # ヒアドキュメントを使うので pwsh ではなく bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, pathlib

          def read(path, pattern):
              src = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(pattern, src, re.M)
              return m.group(1) if m else "?"

          bridge = read("bridge/drg_bridge.py", r'^VERSION\s*=\s*"([^"]+)"')
          mod = read("mod/DRGTranslate/Scripts/main.lua", r'^local MOD_VERSION\s*=\s*"([^"]+)"')
          if bridge != mod:
              sys.exit(f"bridge の VERSION {bridge} と MOD の MOD_VERSION {mod} が一致しません")
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              tag = os.environ["TAG_NAME"].lstrip("v")
              if tag != bridge:
                  sys.exit(f"タグ {tag} とソースのバージョン {bridge} が一致しません")

          wizard = read("bridge/setup_wizard.py", r'^UE4SS_VERSION\s*=\s*"([^"]+)"')
          ps1 = read("install.ps1", r'\$UE4SSVersion\s*=\s*"([^"]+)"')
          if "?" in (wizard, ps1):
              sys.exit("UE4SS のバージョンを読み取れませんでした（変数名が変わっていないか確認してください）")
          if wizard != ps1:
              sys.exit(f"setup_wizard.py の UE4SS_VERSION {wizard} と install.ps1 の UE4SSVersion {ps1} が一致しません")

          # 展開前に照合する zip の SHA-256 も、2つのインストーラでそろっているか見る
          wizard_sha = read("bridge/setup_wizard.py", r'^UE4SS_SHA256\s*=\s*"([0-9a-f]{64})"')
          ps1_sha = read("install.ps1", r'"' + re.escape(wizard) + r'"\s*=\s*"([0-9a-f]{64})"')
          if "?" in (wizard_sha, ps1_sha) or wizard_sha != ps1_sha:
              sys.exit(f"UE4SS {wizard} の SHA-256 が setup_wizard.py（{wizard_sha}）と "
                       f"install.ps1（{ps1_sha}）でそろっていません")
          print(f"バージョン一致: {bridge}（UE4SS {wizard}）")
          PY

      - name: テスト（APIキー不要）
        run: |
          python -m pytest bridge -q
          python bridge/drg_bridge.py --selftest --fake

      - name: exe をビルド
        run: python -m PyInstaller DRGTranslate.spec --noconfirm

      - name: 配布用 zip を作る
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:TAG_NAME } else { 'dev' }
          $dir  = "DRGTranslate-$name-win64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item dist\DRGTranslate.exe $dir\
          Copy-Item settings.example.ini   $dir\
          # 手引きは README.txt の1つだけ。言語ごとの詳しい説明は同梱せず、
          # GitHub の README（6言語）へ誘導する
          Copy-Item docs\README.txt        $dir\
          Copy-Item LICENSE                $dir\
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          # 落とした人が本物か確かめられるよう、SHA-256 を sha256sum と同じ書式で添える
          $hash = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/$dir.zip.sha256", "$hash  $dir.zip`n")
          Write-Host "SHA-256: $hash"
          "ZIP_NAME=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 成果物として残す（手動実行の確認用）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256

      - name: リリースを作って zip を添付
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$env:TAG_NAME" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --generate-notes --title "$env:TAG_NAME"
