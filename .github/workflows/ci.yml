# push と pull request のたびに走るテスト。APIキーは要らない。
#
# リリース（release.yml）はタグを打ったときしか走らないので、普段の変更は
# ここで確かめる。bridge の lint・単体テスト・通し確認と、UE4SS を模した
# スタブでの MOD のロジックの確認（client / host / ソロの host）を行う。
# 利用者は全員 Windows なので、bridge の単体テストと通し確認は Windows でも走らせる。

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4

      - name: lint
        run: ruff check bridge

      - name: install.ps1 の構文
        # 実行はできない（Windows のゲームフォルダが要る）ので、構文だけ確かめる
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          "install.ps1: OK"

      - name: bridge の単体テスト
        run: python -m pytest bridge -q

      - name: bridge の通し確認（--selftest --fake）
        # 同梱する anthropic がこちらの送る引数を受け付けるかも、ここで確かめる
        run: python bridge/drg_bridge.py --selftest --fake --dir "$RUNNER_TEMP/selftest"

      - name: MOD の接続判定（bridge 不要）
        run: lua5.4 tools/ipc_test.lua

      - name: MOD のロジック（UE4SS を模したスタブ）
        # client（4人）/ host（4人）/ ソロの host（1人: 中継せず PostGameMessage で出す）
        run: |
          for spec in client:4 host:4 host:1; do
            role=${spec%%:*}
            players=${spec##*:}
            dir="$RUNNER_TEMP/mock-$role-$players"
            log="$RUNNER_TEMP/bridge-$role-$players.log"
            # --defaults: モックの合否は既定の設定（日本語で読み書き）が前提
            python bridge/drg_bridge.py --fake --defaults --dir "$dir" > "$log" 2>&1 &
            pid=$!
            # 固定の時間ではなく、bridge が生存通知を書くまで待つ（最大10秒）
            for _ in $(seq 50); do [ -f "$dir/bridge.alive" ] && break; sleep 0.2; done
            if ! (cd tools && MOCK_PLAYERS=$players lua5.4 mock_test.lua "$dir" "$role"); then
              echo "--- bridge のログ（$role, $players 人） ---"
              cat "$log"
              kill "$pid"
              exit 1
            fi
            kill "$pid"
          done

  windows:
    # 利用者は全員 Windows。パスの区切り（ue4ss\Mods）、OS の言語の取得（ctypes.windll）、
    # ファイルのロック（msvcrt.locking）、開いているファイルの置き換えなどは Windows でしか通らない
    runs-on: windows-latest
    timeout-minutes: 15
    # PYTHONUTF8 は付けない（利用者の Windows と同じく、既定の文字コードのまま動かす）。
    # requirements*.txt の日本語のコメントは、先頭の coding 宣言が無いと pip が既定の
    # 文字コード（日本語の Windows なら cp932）で読んで失敗する。ここで気づけるようにする

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: bridge の単体テスト
        run: python -m pytest bridge -q

      - name: bridge の通し確認（--selftest --fake）
        run: python bridge/drg_bridge.py --selftest --fake --dir "$env:RUNNER_TEMP\selftest"
